<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>notifys demo</title>
    <link rel="stylesheet" href="./dist/notify.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; padding: 2rem; font: 16px/1.5 system-ui, sans-serif; background: #0f0f0f; color: #eee; }
        main { max-width: 720px; margin: 0 auto; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
        label { display: grid; gap: .35rem; }
        button, input, select { font: inherit; }
        button { padding: .7rem 1rem; border: 0; border-radius: .5rem; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <h1>notifys</h1>
    <div class="controls">
        <label>
            Type
            <select id="type">
                <option>info</option>
                <option>success</option>
                <option>warning</option>
                <option>error</option>
                <option>simple</option>
            </select>
        </label>
        <label>
            Position
            <select id="position">
                <option>top-center</option>
                <option>top-left</option>
                <option>top-right</option>
                <option>bottom-center</option>
                <option>bottom-left</option>
                <option>bottom-right</option>
            </select>
        </label>
        <label>
            Duration, ms
            <input id="duration" type="number" min="0" value="3000">
        </label>
        <label>
            Message
            <input id="message" value="Hello from notifys">
        </label>
        <label><span>Show progress</span><input id="progress" type="checkbox" checked></label>
        <label><span>Pause on hover</span><input id="pause" type="checkbox" checked></label>
        <label><span>Expanded</span><input id="expanded" type="checkbox"></label>
    </div>
    <p><button id="show">Show notification</button></p>
    <p>
        <button id="removeFirst">Remove first</button>
        <button id="removeLast">Remove last</button>
        <button id="removeAll">Remove all</button>
    </p>
</main>
<script type="module">
    import {Notifier} from './dist/notify.js';

    const notifier = new Notifier('top-center');
    const $ = id => document.getElementById(id);

    $('position').addEventListener('change', event => notifier.setPosition(event.target.value));
    $('removeFirst').addEventListener('click', () => notifier.removeFirst());
    $('removeLast').addEventListener('click', () => notifier.removeLast());
    $('removeAll').addEventListener('click', () => notifier.removeAll());

    $('show').addEventListener('click', () => {
        const type = $('type').value;
        const options = {
            message: $('message').value,
            duration: Number($('duration').value),
            showProgress: $('progress').checked,
            pauseOnHover: $('pause').checked,
            expand: $('expanded').checked,
            appearAnimation: 'fadeInDown',
            disappearAnimation: 'fadeOutUp',
        };

        notifier[type](options);
    });
</script>
</body>
</html>
